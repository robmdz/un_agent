[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Health check configuration
healthcheckPath = "/"
healthcheckTimeout = 300

# Resource limits
[deploy.resources]
# Set memory limit (Railway will enforce this)
# Free tier: 512MB, Hobby: 8GB
# We'll target 1GB to be safe
memoryLimit = 1024
